name: Android APK & AAB
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'android/**', 'meanings/**', 'words.js', 'tests/**', 'package*.json', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', 'android/**', 'tests/**', 'package*.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Mobile UI checks
        run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ui-screenshots
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure optional production signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lingo-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/lingo-release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build and lint Android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.STORE_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug assembleRelease bundleRelease lintRelease --no-daemon --console=plain
      - name: Collect packages
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/lingo-1.54.02-debug.apk
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist/lingo-1.54.02-release.apk
            cp android/app/build/outputs/bundle/release/app-release.aab dist/lingo-1.54.02-signed.aab
          else
            cp android/app/build/outputs/bundle/release/app-release.aab dist/lingo-1.54.02-unsigned.aab
          fi
          cp docs/ANDROID.md dist/BUILD-NOTES.md
          cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lingo-android-${{ github.run_number }}
          path: dist/
          retention-days: 90
          if-no-files-found: error
      - name: Publish downloadable Android build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mobile-build-${GITHUB_RUN_NUMBER}" dist/* \
            --target "$GITHUB_SHA" \
            --title "Lingo Android 1.54.02 · Build ${GITHUB_RUN_NUMBER}" \
            --notes-file docs/RELEASE-NOTES.md --prerelease
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/lingo-release.jks"
